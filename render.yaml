services:
  - type: web
    name: dk-fashion-api-image
    runtime: image
    plan: free
    image:
      url: ghcr.io/tppe-2026-1-marketplace/marketplace-backend:latest
      creds:
        fromRegistryCreds:
          name: github-container-registry
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # PAYMENT_GATEWAY_PROVIDER: valor real (infinitepay) é definido manualmente
      # no dashboard do Render. sync:false evita que um re-sync do Blueprint
      # sobrescreva a produção de volta para "mock" (ver issue #162).
      - key: PAYMENT_GATEWAY_PROVIDER
        sync: false
      - key: LOJA_CEP_ORIGEM
        sync: false
