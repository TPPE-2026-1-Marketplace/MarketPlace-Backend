sonar.organization=tppe-2026-1-marketplace
sonar.projectKey=TPPE-2026-1-Marketplace_MarketPlace-Backend
sonar.projectName=MarketPlace-Backend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.integration.ts
sonar.exclusions=**/*.spec.ts,**/*.integration.ts,**/migrations/**

# Espelha o collectCoverageFrom do package.json. Sao arquivos sem logica
# testavel em teste unitario: bootstrap (main.ts), wiring de DI (*.module.ts),
# tipos sem runtime (*.interface.ts), config do TypeORM e barrels (index.ts).
# O jest nao gera cobertura para eles; sem esta lista o Sonar analisa os
# arquivos, nao acha dado no lcov e conta cada linha como descoberta —
# derrubando o Quality Gate de qualquer PR que encoste no bootstrap.
sonar.coverage.exclusions=src/main.ts,**/*.module.ts,**/*.interface.ts,**/database/data-source.ts,**/index.ts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
